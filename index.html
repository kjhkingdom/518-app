<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오월의 기록 탐험대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="초등 5~6학년을 위한 5·18민주화운동 탐구 학습 웹앱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: 기록 보관소의 탐험 노트 — 위쪽 고정 막대, 가운데 한 줄 흐름, 미션은 자료(왼쪽)·활동(오른쪽) 두 단 */
:root {
  --paper: #eef3ee;      /* 바탕: 신록빛이 도는 종이 */
  --card: #fbfcf8;       /* 카드 면 */
  --ink: #1b2c24;        /* 본문 글자 */
  --muted: #56685e;      /* 보조 글자 */
  --line: #cfdad2;       /* 선 */
  --leaf: #2d6a4c;       /* 주 강조: 오월의 잎 */
  --leaf-soft: #dcebe1;
  --stamp: #b3372b;      /* 스탬프 인주 */
  --stamp-soft: #f6e1dc;
  --gold: #c98a12;       /* 힌트·선택 */
  --gold-soft: #f8ecd0;
  --ok: #23714a;
  --sky: #dfeee8; --hill: #9fc2ad; --hill2: #7fae95; --bldg: #c5d6cb; --bldg2: #b0c6b8;
  --skin: #f2c9a5; --hair: #3a2d25; --white: #ffffff;
  --display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111a15; --card: #18241d; --ink: #e5ede7; --muted: #9db1a5; --line: #2b3c33;
    --leaf: #7fc6a0; --leaf-soft: #1f3a2c; --stamp: #ff8270; --stamp-soft: #3d221e;
    --gold: #f0bb4f; --gold-soft: #3a2f17; --ok: #7fd6a4;
    --sky: #1a2b26; --hill: #2a4a3a; --hill2: #345a46; --bldg: #2a3d33; --bldg2: #33493d;
    --skin: #e0b48f; --hair: #1a120d; --white: #f4f1e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111a15; --card: #18241d; --ink: #e5ede7; --muted: #9db1a5; --line: #2b3c33;
  --leaf: #7fc6a0; --leaf-soft: #1f3a2c; --stamp: #ff8270; --stamp-soft: #3d221e;
  --gold: #f0bb4f; --gold-soft: #3a2f17; --ok: #7fd6a4;
  --sky: #1a2b26; --hill: #2a4a3a; --hill2: #345a46; --bldg: #2a3d33; --bldg2: #33493d;
  --skin: #e0b48f; --hair: #1a120d; --white: #f4f1e8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.7;
  word-break: keep-all; overflow-wrap: break-word;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.35; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 상단 막대 */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--display); font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 0; cursor: pointer; min-height: 44px; }
.brand svg { width: 28px; height: 28px; }
.topbar .spacer { flex: 1; }
.stamps-mini { display: flex; gap: 4px; align-items: center; font-size: 15px; color: var(--muted); }
.stamps-mini i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
.stamps-mini i.on { background: var(--stamp); border-color: var(--stamp); }

.wrap {
  max-width: 1080px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 버튼 */
.btn {
  min-height: 48px; padding: 10px 20px; border-radius: 999px; border: 2px solid var(--leaf);
  background: var(--leaf); color: var(--paper); font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  transition: transform .12s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--leaf); }
.btn.small { min-height: 44px; padding: 6px 14px; font-size: 16px; }
.btn.plain { background: transparent; border-color: var(--line); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.eyebrow { font-size: 14px; letter-spacing: .08em; color: var(--leaf); font-weight: 700; }
.muted { color: var(--muted); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }

/* 시작 화면 */
.hero { display: grid; gap: 24px; align-items: center; }
@media (min-width: 900px) { .hero > div:last-child { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); column-gap: 32px; align-items: start; } .hero > div:last-child > .eyebrow, .hero > div:last-child > h1 { grid-column: 1 / -1; } }
.hero-art { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--sky); }
.hero-art svg, .hero-art img { display: block; width: 100%; height: auto; }
figure.hero-art { margin: 0; }
.ai-note { font-size: 13px; color: var(--muted); padding: 6px 10px; background: var(--card); border-top: 1px solid var(--line); }
.avatar img { width: 100%; height: auto; display: block; }
.avatar .ai-note { background: none; border: 0; padding: 4px 0 0; font-size: 11px; line-height: 1.4; }
.bomi-fin { width: 140px; }
.bomi-fin img { width: 100%; height: auto; display: block; }
.v-cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; font-size: 13px; color: #f3f1ea; background: linear-gradient(transparent, rgba(0,0,0,.6)); padding: 18px 16px 6px; text-align: right; }
.hero h1 { font-size: clamp(34px, 6vw, 56px); letter-spacing: -0.01em; }
.hero h1 .accent { color: var(--leaf); }
.hero .lead { font-size: 20px; max-width: 36em; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 16px; }
.hero-meta span { display: inline-flex; gap: 6px; align-items: center; }
.room-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--leaf-soft); color: var(--leaf); }
.room-badge.warn { background: var(--gold-soft); color: var(--gold); }
.room-badge.bad { background: var(--stamp-soft); color: var(--stamp); }
.room-badge button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 700; }
.role-card { display: grid; gap: 16px; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
.role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; background: var(--leaf-soft); border-radius: 16px; }
.role-tabs button { min-height: 52px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-weight: 700; font-size: 19px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.role-tabs button svg { width: 22px; height: 22px; }
.role-tabs button[aria-selected="true"] { background: var(--card); color: var(--leaf); box-shadow: 0 1px 4px rgba(20, 50, 35, .15); }
.join { display: grid; gap: 14px; }
.tpanel { display: grid; gap: 14px; }
.tbox { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; background: color-mix(in srgb, var(--leaf-soft) 45%, var(--card)); }
.tprivacy { font-size: 16px; line-height: 1.7; }
.tprivacy b { font-weight: 700; }
.tprivacy .lock { width: 18px; height: 18px; vertical-align: -3px; margin-right: 4px; }
.tnotice { font-size: 15px; }
.tnotice summary { cursor: pointer; font-weight: 700; color: var(--leaf); min-height: 40px; display: flex; align-items: center; gap: 6px; list-style: none; }
.tnotice summary::-webkit-details-marker { display: none; }
.tnotice summary::before { content: "\25B6"; font-size: 12px; transition: transform .15s ease; }
.tnotice[open] summary::before { transform: rotate(90deg); }
.tnotice dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 4px 0 0; }
.tnotice dt { font-weight: 700; color: var(--muted); }
.tnotice dd { margin: 0; }
.agree { display: flex; gap: 10px; align-items: center; justify-content: center; font-weight: 700; min-height: 44px; cursor: pointer; }
.agree input { width: 22px; height: 22px; accent-color: var(--leaf); }
.gbtn { width: 100%; min-height: 56px; font-size: 19px; }
.gbtn svg { width: 22px; height: 22px; background: #fff; border-radius: 50%; padding: 2px; }
.tsmall { font-size: 14px; color: var(--muted); text-align: center; }
.tsmall a { color: var(--leaf); font-weight: 700; display: inline-block; padding: 10px 4px; }
.join h2 { font-size: 22px; }
.join-row { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 520px) { .join-row { grid-template-columns: minmax(0, 1fr); } }
.join input.code { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.join input.code::placeholder { letter-spacing: 0; font-weight: 400; text-transform: none; font-size: 18px; }
.join label.field { margin-bottom: -6px; }
.jhint { font-size: 14px; color: var(--muted); margin-top: -4px; }
.join-err { color: var(--stamp); font-weight: 700; font-size: 16px; min-height: 1.4em; }
.in-room { display: inline-flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; background: var(--leaf-soft); color: var(--leaf); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.note { font-size: 15px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; max-width: 40em; }

/* 안내 */
.guide { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.speech-wrap { display: flex; gap: 16px; align-items: flex-start; }
.avatar { flex: 0 0 auto; width: 92px; text-align: center; font-size: 13px; color: var(--muted); }
.avatar.photo { width: clamp(110px, 18vw, 170px); }
.avatar svg { width: 92px; height: 92px; display: block; }
.speech { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; flex: 1; }
.speech::before { content: ""; position: absolute; left: -9px; top: 26px; width: 16px; height: 16px; background: var(--card); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.char-tag { display: inline-block; font-size: 13px; border: 1px dashed var(--muted); color: var(--muted); border-radius: 999px; padding: 0 10px; margin-bottom: 6px; }
.rules { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); padding: 0; margin: 0; list-style: none; }
.rules li { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.rules .n { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf); font-weight: 700; display: grid; place-items: center; }

/* 지도 */
.map-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.map-head h1 { font-size: clamp(28px, 4.5vw, 40px); }
.map { position: relative; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.stop {
  position: relative; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px;
  padding: 16px; cursor: pointer; display: grid; gap: 8px; min-height: 44px;
}
.stop:hover:not([disabled]) { border-color: var(--leaf); }
.stop[disabled] { cursor: not-allowed; opacity: .6; }
.stop .art { background: var(--sky); border-radius: 12px; height: 120px; display: grid; place-items: center; overflow: hidden; }
.stop .art svg { width: 150px; height: 120px; }
.stop .no { font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.stop h2 { font-size: 22px; }
.stop .state { font-size: 15px; display: inline-flex; gap: 6px; align-items: center; font-weight: 700; }
.stop .state.done { color: var(--stamp); }
.stop .state.now { color: var(--leaf); }
.stop .state.lock { color: var(--muted); }
.stop.current { border-color: var(--leaf); box-shadow: 0 0 0 4px var(--leaf-soft); }
.stop .stamp-on { position: absolute; right: 10px; top: 10px; width: 78px; height: 78px; transform: rotate(-12deg); }
.here { position: absolute; left: 14px; top: -14px; background: var(--leaf); color: var(--paper); font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.map-foot { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* 미션 */
.m-head { display: grid; gap: 6px; margin-bottom: 18px; }
.m-head h1 { font-size: clamp(26px, 4.4vw, 38px); }
.m-head .q { font-size: 20px; }
.m-goal { font-size: 15px; color: var(--muted); }
.m-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) {
  .m-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
  .m-grid .materials { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px; }
}
.materials { display: grid; gap: 12px; }
.mat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; scroll-margin-top: 90px; }
.mat.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%,100% { box-shadow: none; } 30% { box-shadow: 0 0 0 4px var(--gold); } }
.mat-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.kind { font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 999px; background: var(--leaf-soft); color: var(--leaf); }
.kind.voice { background: var(--gold-soft); color: var(--gold); }
.mat-label { font-size: 13px; color: var(--muted); }
.mat h3 { font-size: 20px; margin-bottom: 6px; }
.mat-art { margin: 4px 0 10px; border-radius: 10px; overflow: hidden; background: var(--sky); }
.mat-art svg { display: block; width: 100%; height: auto; }
.mat-art figcaption { font-size: 13px; color: var(--muted); background: var(--card); padding: 6px 2px 0; }
.mat-art img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; }
.mat-art button.zoom { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }

/* 자료 전체 화면 보기 */
.viewer { position: fixed; inset: 0; z-index: 60; background: #0f1713; color: #f3f1ea; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.v-top { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(#0f1713, rgba(15, 23, 19, .6)); }
.v-top .v-count { font-weight: 700; letter-spacing: .04em; font-size: 15px; }
.v-top .v-note { font-size: 13px; opacity: .75; border: 1px dashed rgba(243, 241, 234, .5); border-radius: 999px; padding: 0 10px; }
.v-top .grow { flex: 1; }
.v-stage { position: relative; overflow: hidden; display: grid; place-items: center; min-height: 0; }
.v-bg { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(24px) brightness(.45); }
.v-stage img, .v-stage .v-svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.v-stage .v-svg { width: 100%; height: 100%; display: grid; place-items: center; background: var(--sky); }
.v-stage .v-svg svg { width: min(100%, 1100px); height: auto; max-height: 100%; }
.v-stage.anim img, .v-stage.anim .v-svg { animation: vin .45s ease both; }
@keyframes vin { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }
.v-panel { position: relative; z-index: 2; background: #f7f8f3; color: #1b2c24; border-top: 4px solid #2d6a4c;
  padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-height: 46vh; overflow: auto; }
.v-panel-in { max-width: 920px; margin: 0 auto; display: grid; gap: 10px; }
.v-panel h2 { font-size: clamp(22px, 3vw, 30px); }
.v-panel .v-text { font-size: clamp(19px, 2.2vw, 23px); line-height: 1.8; }
.v-panel .term { border-bottom-color: #2d6a4c; }
.v-panel .term[aria-expanded="true"] { background: #dcebe1; }
.v-panel .def { background: #dcebe1; color: #1b2c24; }
.v-panel .def b { color: #2d6a4c; }
.v-panel .kind { background: #dcebe1; color: #2d6a4c; }
.v-panel .kind.voice { background: #f8ecd0; color: #8a5a12; }
.v-ctrl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.v-ctrl .grow { flex: 1; }
.v-btn { min-height: 48px; padding: 8px 18px; border-radius: 999px; border: 2px solid #2d6a4c; background: transparent; color: #2d6a4c; font-weight: 700; cursor: pointer; }
.v-btn.solid, .v-btn[aria-pressed="true"] { background: #2d6a4c; color: #f7f8f3; }
.v-btn[disabled] { opacity: .35; cursor: default; }
.v-top .v-btn { border-color: rgba(243, 241, 234, .7); color: #f3f1ea; min-height: 44px; }
.v-top .v-btn.solid { background: #f3f1ea; color: #1b2c24; border-color: #f3f1ea; }
.viewer.text-off .v-panel { display: none; }
.v-dots { display: flex; gap: 6px; }
.v-dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(243, 241, 234, .35); }
.v-dots i.on { background: #f3f1ea; }
@media (max-width: 520px) { .v-top .v-note, .v-top .v-dots { display: none; } .v-top .v-btn { min-height: 40px; padding: 4px 12px; font-size: 15px; } .v-panel { max-height: 52vh; } }
.mat.reading { border-color: var(--leaf); box-shadow: 0 0 0 3px var(--leaf-soft); }
.listen { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 2px solid var(--leaf); background: transparent; color: var(--leaf); font-weight: 700; font-size: 15px; cursor: pointer; margin-left: auto; }
.listen[aria-pressed="true"] { background: var(--leaf); color: var(--paper); }
.mat-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.tts-note { font-size: 14px; color: var(--gold); }
#musicBtn[aria-pressed="true"] { border-color: var(--leaf); color: var(--leaf); background: var(--leaf-soft); }
.term { background: none; border: 0; padding: 0 1px; border-bottom: 2px dotted var(--leaf); color: inherit; cursor: pointer; font-weight: 700; min-height: 0; }
.term[aria-expanded="true"] { background: var(--leaf-soft); }
.def { margin-top: 10px; background: var(--leaf-soft); border-radius: 10px; padding: 10px 14px; font-size: 16px; }
.def b { color: var(--leaf); }

.activity { display: grid; gap: 16px; }
.steps { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.steps button { width: 44px; height: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; padding: 0; }
.steps button.cur { border-color: var(--leaf); color: var(--leaf); }
.steps button.ok { background: var(--leaf); border-color: var(--leaf); color: var(--paper); }
.steps button[disabled] { cursor: not-allowed; opacity: .5; }

.oxb { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); font-size: 24px; font-weight: 700; cursor: pointer; display: grid; place-items: center; font-family: var(--body); }
.oxb.o { color: var(--leaf); } .oxb.x { color: var(--stamp); }

.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.order li { display: flex; gap: 10px; align-items: center; background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 12px; }

      '<div class="m-grid"><div class="materials' + (window.innerWidth < 900 ? " folded" : "") + '" id="matsBox" aria-label="자료 카드">' + mats + '<p class="muted" style="font-size:14px">자료는 역사 사실을 학생용으로 풀어 쓴 글이에요. 밑줄 친 낱말을 누르면 뜻이 나와요.</p></div>' +

  var TYPE_LABEL = { ox: "OX 퀴즈", order: "사건 순서 맞추기", evidence: "근거 문장 찾기", choice: "알맞은 답 고르기", match: "짝 잇기", reflect: "나의 생각 쓰기" };

  function vActivity(m, step, a) {

          '<span class="oxbtns" role="group" aria-label="' + (k + 1) + '번 답">' +

          '<button type="button" class="oxb x" data-ox="' + k + '" data-v="0" aria-pressed="' + (shown === false) + '" aria-label="X, 틀려요"' + (solved ? " disabled" : "") + ">X</button></span></li>";
      });

      var answered = Object.keys(w.ans).length;
      if (!solved) body += '<div class="btn-row"><button class="btn" id="check" type="button"' + (answered < a.items.length ? " disabled" : "") + '>정답 확인하기</button><span class="muted" style="font-size:15px" id="oxCount">' + answered + " / " + a.items.length + "개 골랐어요</span></div>";
    } else if (a.type === "choice") {
      body = '<div class="opts" role="group" aria-label="보기">';
      a.options.forEach(function (o, k) {

      });

    } else if (a.type === "order") {
      if (!w.order) w.order = a.start.slice();
      var showDates = solved || !a.hideDates;
      body = '<ol class="order" id="orderList">';
      w.order.forEach(function (id, k) {
        var it = a.items.filter(function (x) { return x.id === id; })[0];
        var placed = solved || (w.placed && w.placed[k]);
        body += '<li draggable="' + (!solved) + '" data-id="' + id + '" class="' + (placed ? "placed" : "") + '">' +
          (solved ? "" : '<span class="grip" aria-hidden="true">⠿</span>') +
          '<span class="pos">' + (k + 1) + '</span><span class="txt">' + (showDates ? '<span class="date">' + esc(it.date) + "</span>" : "") + esc(it.text) + "</span>" +
          (solved ? "" : '<span class="mv"><button type="button" data-up="' + k + '" aria-label="' + (k + 1) + '번째 카드를 위로"' + (k === 0 ? " disabled" : "") + '>▲</button><button type="button" data-down="' + k + '" aria-label="' + (k + 1) + '번째 카드를 아래로"' + (k === w.order.length - 1 ? " disabled" : "") + ">▼</button></span>") +
        "</li>";
      });
      body += "</ol>";
      if (!solved) body += '<div class="btn-row"><button class="btn" id="check" type="button">순서 확인하기</button></div>';
    } else if (a.type === "evidence") {
      if (!w.sel) w.sel = [];
      var need = a.sentences.filter(function (s) { return s.correct; }).length;
      body = '<div class="passage"><span class="passage-title">' + esc(a.passageTitle) + "</span>";
      a.sentences.forEach(function (s, k) {
        var on = w.sel.indexOf(k) > -1;
        body += '<button type="button" class="sent ' + (solved && s.correct ? "right" : "") + '" data-k="' + k + '" aria-pressed="' + (!solved && on) + '"' + (solved ? " disabled" : "") + ">" + esc(s.text) + "</button>";
      });
      body += "</div>";
      if (!solved) body += '<div class="btn-row"><button class="btn" id="check" type="button">근거 확인하기</button><span class="muted" style="font-size:15px" id="selCount">' + w.sel.length + " / " + need + "개 골랐어요</span></div>";
    } else if (a.type === "match") {
      if (!w.pairs) w.pairs = {};
      var pairIdx = {}; var n = 0;
      a.left.forEach(function (l) { if (w.pairs[l.id]) pairIdx[l.id] = n++; });
      var rightOf = {}; for (var lid in w.pairs) rightOf[w.pairs[lid]] = lid;
      body = '<div class="match"><div class="col"><span class="col-title">' + (a.leftTitle || "행동·연도") + "</span>";
      a.left.forEach(function (l) {

        body += '<button type="button" class="mcard ' + (p ? "paired pc" + pi : "") + (w.selL === l.id ? " sel" : "") + (solved ? " right" : "") + '" data-l="' + l.id + '"' + (solved ? " disabled" : "") + ' aria-pressed="' + (w.selL === l.id) + '"><span class="tag">' + (p ? pi + 1 : "?") + "</span><span>" + esc(l.text) + "</span></button>";
      });
      body += '</div><div class="col"><span class="col-title">' + (a.rightTitle || "담긴 뜻·사건") + "</span>";
      a.right.forEach(function (r) {
        var lidp = rightOf[r.id], pi2 = lidp != null ? pairIdx[lidp] : null;
        body += '<button type="button" class="mcard ' + (lidp ? "paired pc" + pi2 : "") + (solved ? " right" : "") + '" data-r="' + r.id + '"' + (solved ? " disabled" : "") + '><span class="tag">' + (lidp ? pi2 + 1 : "·") + "</span><span>" + esc(r.text) + "</span></button>";
      });
      body += "</div></div>";
      if (!solved) body += '<div class="btn-row"><button class="btn" id="check" type="button"' + (Object.keys(w.pairs).length < a.left.length ? " disabled" : "") + '>짝 확인하기</button><span class="muted" style="font-size:15px">' + Object.keys(w.pairs).length + " / " + a.left.length + "쌍 연결</span></div>";
    } else if (a.type === "reflect") {
      var wr = S.writing[a.key] || { choice: null, text: "" };
      body = (a.scenario ? '<div class="scenario"><b>이런 상황이라면?</b>' + esc(a.scenario) + "</div>" : "") +
        '<div class="chips" role="group" aria-label="고르기">';
      a.options.forEach(function (o, k) { body += '<button type="button" class="chip" data-k="' + k + '" aria-pressed="' + (wr.choice === k) + '">' + esc(o) + "</button>"; });
      body += '</div><label class="field" for="rf_' + a.key + '">까닭 쓰기 <span class="sub">한두 문장이면 충분해요. 정답은 없어요.</span></label>' +
        '<textarea id="rf_' + a.key + '" placeholder="' + esc(a.placeholder) + '">' + esc(wr.text) + "</textarea>" +
        '<div class="counter" id="rfCount"></div>' +
        (solved ? "" : '<div class="btn-row"><button class="btn" id="check" type="button">기록장에 남기기</button></div>');
    }
    var fb = "";
    if (solved) {
      fb = '<div class="fb good" role="status"><span class="fb-t">✓ ' + (a.type === "reflect" ? "기록장에 남겼어요" : "잘 찾았어요!") + "</span><p>" + esc(a.explanation) + "</p></div>";
      var m2 = m, last = step === m2.activities.length - 1;
      fb += '<div class="btn-row">' + (a.type === "reflect" ? '<button class="btn plain small" id="saveAgain" type="button">고친 내용 저장</button>' : "") +
        (last ? (S.done[m2.id] ? '<button class="btn" id="toMap" type="button">미션 지도로 돌아가기</button>' : '<button class="btn" id="complete" type="button">미션 완료! 스탬프 받기</button>')
              : '<button class="btn" id="next" type="button">다음 문제</button>') + "</div>";
    } else if (w.hint) {
      fb = '<div class="fb hint" role="status"><span class="fb-t">힌트 · ' + esc(w.hint) + "</span><p>" + esc(a.hint || "") + '</p><button type="button" class="linklike" id="reread">자료 다시 읽기</button></div>';
    }
    return '<span class="act-type">문제 ' + (step + 1) + " · " + TYPE_LABEL[a.type] + "</span><h2>" + esc(a.prompt) + "</h2>" + body + '<div id="fb" aria-live="polite">' + fb + "</div>";
  }

  function bMission() {
    var m = mById(S.mission), step = S.step, a = m.activities[step], w = work(m.id, step);
    $("#backMap").onclick = function () { go("map"); };

    // 나레이션
    function matText(t) { return t.title + ". " + t.text.replace(/\[\[(.+?)\]\]/g, "$1"); }
    function setListenUI(activeK, all) {
      $$(".listen[data-listen]").forEach(function (b) { var on = String(activeK) === b.getAttribute("data-listen"); b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "■ 멈추기" : "▶ 듣기"; });
      var la = $("#listenAll"); if (la) { la.setAttribute("aria-pressed", String(!!all)); la.textContent = all ? "■ 멈추기" : "▶ 자료 모두 듣기"; }
      $$(".mat").forEach(function (c, i) { c.classList.toggle("reading", i === activeK); });
    }
    function playCards(list, all) {
      var i = 0;
      (function nextCard() {
        if (i >= list.length) { setListenUI(null, false); return; }
        var k = list[i++];
        setListenUI(k, all);
        var card = $("#mat" + k); if (all && card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        Narrator.speak(matText(m.materials[k]), nextCard, function () { setListenUI(null, false); }, m.materials[k].audio);
      })();
    }
    if (!Narrator.ttsOK() && m.materials.some(function (t) { return !t.audio; })) { var nt = $("#ttsNote"); if (nt) nt.textContent = "녹음이 없는 자료는 이 브라우저에서 읽어 줄 수 없어요."; }
    $$(".listen[data-listen]").forEach(function (b) {
      b.onclick = function () {
        if (b.getAttribute("aria-pressed") === "true") { Narrator.stop(); setListenUI(null, false); return; }
        playCards([+b.getAttribute("data-listen")], false);
      };
    });
    $("#openViewer").onclick = function () { Narrator.stop(); setListenUI(null, false); openViewer(m.id, 0); };
    var fb0 = $("#foldMats"), box0 = $("#matsBox");
    var syncFold = function () { var f = box0.classList.contains("folded"); fb0.setAttribute("aria-expanded", String(!f)); fb0.textContent = f ? "자료 카드 펼치기 (" + m.materials.length + "장)" : "자료 카드 접기"; };
    fb0.onclick = function () { box0.classList.toggle("folded"); syncFold(); };
    syncFold();
    $$("[data-zoom]").forEach(function (b) { b.onclick = function () { Narrator.stop(); setListenUI(null, false); openViewer(m.id, +b.getAttribute("data-zoom")); }; });
    if (!S.viewed[m.id] && !isSolved(m.id, 0)) setTimeout(function () { openViewer(m.id, 0); }, 50);
    $("#listenAll").onclick = function () {
      if (this.getAttribute("aria-pressed") === "true") { Narrator.stop(); setListenUI(null, false); return; }
      playCards(m.materials.map(function (_, k) { return k; }), true);
    };

    $$(".steps button[data-step]").forEach(function (b) { b.onclick = function () { S.step = +b.getAttribute("data-step"); save(); render(); }; });

    // 용어 풀이
    $$(".term").forEach(function (t) {
      t.onclick = function () {
        var card = t.closest(".mat"), def = card.querySelector(".def"), open = t.getAttribute("aria-expanded") === "true";
        $$(".term", card).forEach(function (x) { x.setAttribute("aria-expanded", "false"); });
        if (open) { def.hidden = true; return; }
        t.setAttribute("aria-expanded", "true");
        def.innerHTML = "<b>" + esc(t.getAttribute("data-term")) + "</b> — " + esc(C.glossary[t.getAttribute("data-term")]);
        def.hidden = false;
      };
    });

    function refresh() { save(); var y = window.scrollY; $("#act").innerHTML = vActivity(m, step, a); bMission.bindAct(); window.scrollTo(0, y); }
    function fail(msg) { w.tries = (w.tries || 0) + 1; w.hint = msg; refresh(); var f = $("#fb"); if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    function pass() { S.solved[sKey(m.id, step)] = true; w.hint = null; save(); var y = window.scrollY; render(); window.scrollTo(0, y); var f = $("#fb"); if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" }); }

    bMission.bindAct = function () {
      var solved = isSolved(m.id, step);
      var rr = $("#reread"); if (rr) rr.onclick = function () { var bx = $("#matsBox"); if (bx && bx.classList.contains("folded")) { bx.classList.remove("folded"); var fbb = $("#foldMats"); if (fbb) { fbb.setAttribute("aria-expanded", "true"); fbb.textContent = "자료 카드 접기"; } } var el = $("#mat0"); el.scrollIntoView({ behavior: "smooth", block: "start" }); $$(".mat").forEach(function (x) { x.classList.remove("flash"); void x.offsetWidth; x.classList.add("flash"); }); };
      var nx = $("#next"); if (nx) nx.onclick = function () { S.step = step + 1; save(); render(); $("#act").scrollIntoView({ block: "start" }); };
      var cp = $("#complete"); if (cp) cp.onclick = completeMission;
      var tm = $("#toMap"); if (tm) tm.onclick = function () { go("map"); };

      if (a.type === "ox" && !solved) {
        $$(".oxb").forEach(function (b) {
          b.onclick = function () {
            var k = +b.getAttribute("data-ox"), v = b.getAttribute("data-v") === "1";
            w.ans[k] = v; if (w.miss) w.miss = w.miss.filter(function (x) { return x !== k; });
            $$('.oxb[data-ox="' + k + '"]').forEach(function (x) { x.setAttribute("aria-pressed", String((x.getAttribute("data-v") === "1") === v)); });
            var n = Object.keys(w.ans).length; $("#oxCount").textContent = n + " / " + a.items.length + "개 골랐어요";
            $("#check").disabled = n < a.items.length; save();
          };
        });
        $("#check").onclick = function () {
          var miss = []; a.items.forEach(function (it, k) { if (w.ans[k] !== it.answer) miss.push(k); });
          if (!miss.length) pass();
          else { miss.forEach(function (k) { delete w.ans[k]; }); w.miss = miss; fail(a.items.length + "개 가운데 " + (a.items.length - miss.length) + "개를 맞혔어요. 점선 테두리 문제를 다시 골라 보세요."); }
        };
      }
      if (a.type === "choice" && !solved) {
        $$(".opt").forEach(function (b) {
          b.onclick = function () {
            var k = +b.getAttribute("data-k");
            if (a.options[k].correct) pass();
            else { w.wrong = (w.wrong || []).concat([k]); fail("아쉬워요. 다른 보기를 골라 보세요."); }
          };
        });
      }
      if (a.type === "order" && !solved) {
        function move(from, to) { var o = w.order; var x = o.splice(from, 1)[0]; o.splice(to, 0, x); w.placed = null; w.hint = null; refresh(); var btn = $('[data-' + (to < from ? "up" : "down") + '="' + to + '"]') || $('[data-up="' + to + '"]') || $('[data-down="' + to + '"]'); if (btn) btn.focus(); }
        $$("[data-up]").forEach(function (b) { b.onclick = function () { var k = +b.getAttribute("data-up"); if (k > 0) move(k, k - 1); }; });
        $$("[data-down]").forEach(function (b) { b.onclick = function () { var k = +b.getAttribute("data-down"); if (k < w.order.length - 1) move(k, k + 1); }; });
        var dragFrom = null;
        $$("#orderList li").forEach(function (li, k) {
          li.addEventListener("dragstart", function (e) { dragFrom = k; li.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", String(k)); e.dataTransfer.effectAllowed = "move"; } catch (er) {} });
          li.addEventListener("dragend", function () { li.classList.remove("dragging"); });
          li.addEventListener("dragover", function (e) { e.preventDefault(); li.classList.add("over"); });
          li.addEventListener("dragleave", function () { li.classList.remove("over"); });
          li.addEventListener("drop", function (e) { e.preventDefault(); li.classList.remove("over"); if (dragFrom !== null && dragFrom !== k) move(dragFrom, k); dragFrom = null; });
        });
        $("#check").onclick = function () {
          var right = 0, placed = [];
          var ans = a.items.map(function (x) { return x.id; });
          w.order.forEach(function (id, k) { var ok = ans[k] === id; placed.push(ok); if (ok) right++; });
          if (right === ans.length) pass();
          else { w.placed = placed; fail(ans.length + "장 가운데 " + right + "장이 제자리에 있어요. 초록 테두리 카드는 맞은 자리예요."); }
        };
      }
      if (a.type === "evidence" && !solved) {
        var need = a.sentences.filter(function (s) { return s.correct; }).length;
        $$(".sent").forEach(function (b) {
          b.onclick = function () {
            var k = +b.getAttribute("data-k"), i = w.sel.indexOf(k);
            if (i > -1) w.sel.splice(i, 1); else w.sel.push(k);
            b.setAttribute("aria-pressed", String(i < 0));
            $("#selCount").textContent = w.sel.length + " / " + need + "개 골랐어요";
            save();
          };
        });
        $("#check").onclick = function () {
          if (w.sel.length !== need) { fail(need + "개를 골라 주세요. 지금 " + w.sel.length + "개를 골랐어요."); return; }
          var right = w.sel.filter(function (k) { return a.sentences[k].correct; }).length;
          if (right === need) pass(); else fail(need + "개 가운데 " + right + "개가 근거로 알맞아요. 나머지를 다시 살펴봐요.");
        };
      }
      if (a.type === "match" && !solved) {
        $$("[data-l]").forEach(function (b) {
          b.onclick = function () {
            var id = b.getAttribute("data-l");
            if (w.pairs[id]) { delete w.pairs[id]; w.selL = null; }
            else w.selL = (w.selL === id ? null : id);
            w.hint = null; refresh();
            var again = $('[data-l="' + id + '"]'); if (again) again.focus();
          };
        });
        $$("[data-r]").forEach(function (b) {
          b.onclick = function () {
            var rid = b.getAttribute("data-r");

            else { w.hint = null; refresh(); var h = $("#fb"); if (h) h.innerHTML = '<div class="fb hint"><span class="fb-t">먼저 왼쪽 카드를 하나 눌러 주세요.</span></div>'; return; }
            w.hint = null; refresh();

            var f = nextL ? $('[data-l="' + nextL.id + '"]') : $("#check"); if (f) f.focus();
          };
        });
        $("#check").onclick = function () {
          var right = 0, wrongL = [];
          a.left.forEach(function (l) { if (w.pairs[l.id] === a.answer[l.id]) right++; else wrongL.push(l.id); });
          if (right === a.left.length) pass();
          else { wrongL.forEach(function (l) { delete w.pairs[l]; }); fail(a.left.length + "쌍 가운데 " + right + "쌍이 맞았어요. 맞은 짝은 남겨 두었어요."); }
        };

        var wr = S.writing[a.key] || (S.writing[a.key] = { choice: null, text: "" });
        var ta = $("#rf_" + a.key), cnt = $("#rfCount"), chk = $("#check"), sv = $("#saveAgain");
        function upd() {
          var len = ta.value.trim().length, ok = wr.choice !== null && len >= (a.minLength || 1);
          cnt.textContent = (wr.choice === null ? "위에서 하나를 골라 주세요 · " : "") + len + "자" + (len < a.minLength ? " (" + a.minLength + "자 이상 써 주세요)" : "");
          if (chk) chk.disabled = !ok;
          if (sv) sv.disabled = !ok;

        ta.oninput = function () { wr.text = ta.value; save(); upd(); };
        upd();
        if (chk) chk.onclick = function () { wr.text = ta.value.trim(); pass(); };
        if (sv) sv.onclick = function () { wr.text = ta.value.trim(); save(); sv.textContent = "저장했어요 ✓"; };
      }
    };
    bMission.bindAct();

  /* ---------- 엽서 그리기 (캔버스) ---------- */

      ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(150, 470); ctx.bezierCurveTo(240, 420, 300, 380, 360, 300); ctx.stroke();

      for (i = 0; i < 6; i++) {

        ctx.save(); ctx.translate(x + 40, y + 50); ctx.rotate((r() - .5) * .4); ctx.scale(s, s);
        ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#d8c8a6"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, -70); ctx.bezierCurveTo(30, -70, 70, 20, 62, 44); ctx.bezierCurveTo(56, 64, -56, 64, -62, 44); ctx.bezierCurveTo(-70, 20, -30, -70, 0, -70); ctx.closePath(); ctx.fill(); ctx.stroke();

  function askReset() {
    showModal('<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rt"><h2 id="rt">학급방에서 나가고 처음부터 시작할까요?</h2>' +
      "<p>이 기기에 남은 스탬프, 기록장, 엽서 내용이 지워져요. 선생님 화면에 전달된 기록은 그대로 남아요. 엽서를 저장했는지 먼저 확인하세요.</p>" +
      '<div class="btn-row"><button class="btn plain" id="rNo" type="button">취소</button><button class="btn" id="rYes" type="button" style="background:var(--stamp);border-color:var(--stamp)">모두 지우고 새로 시작</button></div></div>',
      function () {
        $("#rNo", modalRoot).onclick = closeModal;
        $("#rYes", modalRoot).onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} var lc = S.room ? S.room.code : S.lastCode; clearTimeout(pushTimer); if (window.Backend && Backend.leave) Backend.ready.then(function (B) { B.leave(); }); S = fresh(); S.lastCode = lc; roomStatus = "idle"; closeModal(); go("start"); };
      });
  }

  /* ---------- 렌더 ---------- */
  var VIEWS = {
    start: [vStart, bStart], guide: [vGuide, bGuide], map: [vMap, bMap], mission: [vMission, bMission],
    journal: [vJournal, bJournal], postcard: [vPostcard, bPostcard], finish: [vFinish, bFinish]
  };
  function render() {
    if (!S.room && S.screen !== "start") S.screen = "start";
    var v = VIEWS[S.screen] || VIEWS.start;
    if (S.screen === "mission" && !mById(S.mission)) { S.screen = "map"; v = VIEWS.map; }
    if (S.screen === "postcard" && !allDone()) { S.screen = "journal"; v = VIEWS.journal; }
    if (S.screen !== "start") S.lastScreen = S.screen;
    app.innerHTML = v[0]();
    v[1]();
    renderTop(); renderRoomBadge();
    var h = document.getElementById("h"); document.title = (h && h.textContent !== C.title ? h.textContent + " · " : "") + C.title;
  }
  document.getElementById("brandBtn").onclick = function () { go(S.screen === "start" ? "start" : "map"); };
  document.getElementById("musicBtn").onclick = function () {
    if (Music.isOn()) Music.stop(); else if (!Music.start()) { this.textContent = "♪ 음악 지원 안 됨"; return; }
    try { localStorage.setItem(KEY + "-music", Music.isOn() ? "1" : "0"); } catch (e) {}
    syncMusicBtn();
  };
  document.getElementById("journalBtn").onclick = function () { go("journal"); };
  document.getElementById("resetBtn").onclick = askReset;

  try { if (localStorage.getItem(KEY + "-music") === "1") document.addEventListener("pointerdown", function once(e) { if (e.target.closest && e.target.closest("#musicBtn")) return; document.removeEventListener("pointerdown", once); if (!Music.isOn() && Music.start()) syncMusicBtn(); }); } catch (e) {}

  if (S.room) {
    var p = new URLSearchParams(location.search).get("room");
    Backend.ready.then(function (B) { return B.isJoined(S.room.code); }).then(function (ok) {
      if (!S.room) return;
      if (ok) doPush(); else { roomStatus = "not_joined"; renderRoomBadge(); }
    });
    if (p && Backend.normalizeCode(p) !== S.room.code) { S.lastCode = Backend.normalizeCode(p); }
  }
  window.addEventListener("online", function () { if (S.room) doPush(); });

  // 처음 열면 항상 시작 화면에서 '이어서 탐험하기'를 고를 수 있게 함
  if (S.screen !== "start") { S.lastScreen = S.screen; S.screen = "start"; }
  render();
})();
</script>

</body>
</html>
